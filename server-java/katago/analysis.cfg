# KataGo 分析引擎配置（GameGo 服务端使用）
#
# 适用：KataGo v1.18.1 Eigen（纯 CPU）版，2~4 核的云服务器；由 v1.18.1 自带的 analysis_example.cfg 精简而来。
# 服务端以 `katago analysis -config <本文件> -model <权重文件>` 启动它（Java 版见 server-java/src/main/java/com/gamego/ai/KataGoEngine.java，Node 版见 server/src/ai/katago.js）。
# 修改后重启服务端生效。调参说明见 docs/ai.md 第 5 节。
#
# 出处与许可：参数名和部分默认值来自 KataGo v1.18.1 的 cpp/configs/analysis_example.cfg
#   https://github.com/lightvector/KataGo/blob/v1.18.1/cpp/configs/analysis_example.cfg
#   Copyright 2025 David J Wu ("lightvector") and/or other authors of the content in this repository.
#   MIT License，许可全文见仓库根目录的 THIRD_PARTY_NOTICES.md（第 2 节）。
#
# 注意：KataGo 的配置文件里 # 之后都是注释。

# ---------------------------------------------------------------------------
# 日志
# ---------------------------------------------------------------------------
# 默认不写日志文件：不设置 logDir / logFile 时，KataGo 只把日志写到 stderr，
# 服务端会把这些行以 debug 级别转进自己的日志（LOG_LEVEL=debug 时可见）。
# 不在这里写 `logDir = analysis_logs` 这类相对路径，是因为它相对的是服务端进程的工作目录，
# 很可能就是仓库目录，每次启动都会在仓库里新建一个日志文件。
# 确实需要 KataGo 自己的日志时，改成仓库外的绝对路径，例如：
# logDir = /var/log/gamego/katago        # Linux：每次启动新建一个日志文件（目录需可写）
# logDir = D:/logs/katago                # Windows 开发机

# 下面三项在排查问题时可以临时打开（会让日志变大）
# logAllRequests = true
# logAllResponses = true
# logSearchInfo = true

# ---------------------------------------------------------------------------
# 分析结果的视角与请求检查（服务端代码依赖这些值，不要改）
# ---------------------------------------------------------------------------
# winrate / scoreLead / ownership 一律按黑方视角（+ 表示对黑有利）。服务端每个请求也会再指定一次。
reportAnalysisWinratesAs = BLACK
# 请求里有拼错的字段时回一条 warning（服务端只记 debug 日志，不影响结果）
warnUnusedFields = true
# 开局连续两手黑棋不当作让子（本项目没有让子棋）
assumeMultipleStartingBlackMovesAreHandicap = false

# ---------------------------------------------------------------------------
# 搜索
# ---------------------------------------------------------------------------
# 请求没写 maxVisits 时的默认值。服务端每个请求都会指定：弱档 1 次，最强档 300 次，死子判断 200 次。
maxVisits = 200
# 根节点随机噪声。用分析引擎"下棋"时官方建议设 0（最强、不乱走）。服务端的搜索请求也会指定 0。
wideRootNoise = 0.0

# ---------------------------------------------------------------------------
# 线程（最影响速度的部分，按服务器核数调整）
# ---------------------------------------------------------------------------
# 同时分析的局面数 = 能并行处理的 AI 请求数（多局人机同时思考时有用）。
# 超出的请求在 KataGo 内部排队。2 核建议 1~2，4 核建议 2。
numAnalysisThreads = 2
# 每个局面的搜索线程数。只影响最强档（300 次搜索）与死子判断（200 次）的耗时，弱档每步只评估 1 次。
# 2 核建议 1，4 核建议 2。
numSearchThreadsPerAnalysisThread = 2
# 神经网络计算用的 CPU 线程数，一般设为物理核数（2 核写 2，4 核写 4）。
# 不写时默认为 min(numAnalysisThreads × numSearchThreadsPerAnalysisThread, CPU 核数)。
numEigenThreadsPerModel = 4
# 神经网络批大小，应 ≥ numAnalysisThreads × numSearchThreadsPerAnalysisThread。
nnMaxBatchSize = 4

# ---------------------------------------------------------------------------
# 内存
# ---------------------------------------------------------------------------
# 神经网络结果缓存大小为 2^N 项。20 时 KataGo 进程常驻内存约 120~150MB（b10c128 权重）；
# 官方示例的 23 约 250~270MB。内存很紧时可降到 18（约 110~140MB），代价是重复局面要重新计算。
nnCacheSizePowerOfTwo = 20
nnMutexPoolSizePowerOfTwo = 14
# 每次评估随机选一种棋盘对称变换，让同一局面的弱档着法有些变化（KaTrain 也这样设）。
nnRandomize = true

# ---------------------------------------------------------------------------
# 只下 9 路时的提速（可选，默认关闭）
# ---------------------------------------------------------------------------
# 默认神经网络按 19×19 的缓冲区计算，9 路和 19 路一样慢。只服务 9 路时打开下面三行可快约 2 倍，
# 但此后任何 13/19 路请求都永远没有结果（只能超时），并卡住 KataGo 的一个分析线程；所有分析线程都卡住后
# 服务端才会判定卡死并重启进程。所以混合路数时不要打开。
# maxBoardXSizeForNNBuffer = 9
# maxBoardYSizeForNNBuffer = 9
# requireMaxBoardSize = true
