# 本地开发 / 冒烟测试用的 H2 文件数据库（MySQL 兼容模式），不需要安装 MySQL：
#   java -jar target/gamego-server-java-0.1.0.jar --spring.profiles.active=h2
# 数据保存在 ./data/gamego-h2.mv.db（DB_URL 可覆盖，如 jdbc:h2:mem:gamego;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1）。
spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/gamego-h2;MODE=MySQL;DATABASE_TO_LOWER=TRUE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: org.h2.Driver
  sql:
    init:
      schema-locations: classpath:db/schema-h2.sql
